name: Profile Quality Gate

on:
  pull_request:
    paths:
      - "README.md"
      - "assets/YashKanadhia_GitHubBanner_Option2_*"
      - ".github/workflows/profile-quality.yml"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profile-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Check whitespace
        run: git diff --check

      - name: Validate README and approved Option 2 assets
        shell: python
        run: |
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          root = Path('.')
          readme_path = root / 'README.md'
          readme = readme_path.read_text(encoding='utf-8')
          assets = root / 'assets'

          motion_svg = assets / 'YashKanadhia_GitHubBanner_Option2_Motion.svg'
          static_png = assets / 'YashKanadhia_GitHubBanner_Option2_Approved.png'
          static_svg = assets / 'YashKanadhia_GitHubBanner_Option2_Approved.svg'
          motion_mp4 = assets / 'YashKanadhia_GitHubBanner_Option2_Motion.mp4'

          required_refs = (
              './assets/YashKanadhia_GitHubBanner_Option2_Motion.svg?rev=20260810-1',
              './assets/YashKanadhia_GitHubBanner_Option2_Approved.png?rev=20260810-1',
              './assets/YashKanadhia_GitHubBanner_Option2_Motion.mp4',
              './assets/YashKanadhia_GitHubBanner_Option2_Approved.svg',
          )
          for ref in required_refs:
              if readme.count(ref) != 1:
                  raise SystemExit(f'README must reference {ref} exactly once')

          for path in (motion_svg, static_png, static_svg, motion_mp4):
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f'Missing or empty approved asset: {path}')

          ET.parse(motion_svg)
          motion_text = motion_svg.read_text(encoding='utf-8').lower()
          for token in ('<script', 'javascript:', '<foreignobject', 'onload=', 'onclick='):
              if token in motion_text:
                  raise SystemExit(f'Unsafe SVG token {token} in {motion_svg}')
          for required in ('role="img"', 'viewbox=', '<title', '<desc', 'prefers-reduced-motion', '@keyframes'):
              if required not in motion_text:
                  raise SystemExit(f'Missing {required} in {motion_svg}')

          ET.parse(static_svg)

          if static_png.read_bytes()[:8] != b'\x89PNG\r\n\x1a\n':
              raise SystemExit(f'Invalid PNG signature: {static_png}')
          mp4_head = motion_mp4.read_bytes()[:12]
          if len(mp4_head) < 8 or mp4_head[4:8] != b'ftyp':
              raise SystemExit(f'Invalid MP4 signature: {motion_mp4}')

          stale_refs = (
              './assets/hero/yash-github-banner-motion.svg',
              './assets/hero/yash-github-banner-static.png',
              'Zeref Memory Engine',
          )
          hits = [token for token in stale_refs if token in readme]
          if hits:
              raise SystemExit(f'Stale profile references remain: {hits}')

          required_copy = (
              'Product Designer',
              'AI-enabled products, complex workflows, and implementation systems',
              'Shiroe',
              'PerFin OS',
              'For Rent',
              'StreamNexus',
              'Yash Kanadhia, Alexis Gorospe, and Sarmad Tariq',
          )
          for token in required_copy:
              if token not in readme:
                  raise SystemExit(f'Missing required public-profile copy: {token}')

          order = [readme.index(token) for token in ('Shiroe', 'PerFin OS', 'For Rent', 'StreamNexus')]
          if order != sorted(order):
              raise SystemExit('Selected product order must be Shiroe → PerFin OS → For Rent → StreamNexus')

          start = '<!-- 60-SECOND-PROFILE:START -->'
          end = '<!-- 60-SECOND-PROFILE:END -->'
          if readme.count(start) != 1 or readme.count(end) != 1:
              raise SystemExit('60-second profile markers must appear exactly once')
          scan = readme.split(start, 1)[1].split(end, 1)[0]
          scan = re.sub(r'<[^>]+>', ' ', scan)
          scan = re.sub(r'https?://\S+', ' ', scan)
          words = re.findall(r"\b[\w’'-]+\b", scan)
          if len(words) > 220:
              raise SystemExit(f'60-second profile exceeds 220 words: {len(words)}')

          print(f'Profile gate passed: {len(words)}-word recruiter scan; approved motion/static asset family validated.')
