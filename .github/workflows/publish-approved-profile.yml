name: Publish approved GitHub profile

on:
  push:
    branches:
      - mavis/github-profile-banner-20260809
    paths:
      - .publish-profile/READY

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out staged approved profile
        uses: actions/checkout@v4
        with:
          ref: mavis/github-profile-banner-20260809
          fetch-depth: 0

      - name: Verify exact approved payload
        shell: bash
        run: |
          set -euo pipefail
          echo "3e505cd4a9ef5dd102fe51fe68199afb7a6f6f47872549c609829efaca67e9f9  assets/hero/yash-kanadhia-github-banner-option2-static.png" | sha256sum -c -
          echo "1ef1beda70f73dc07db4bf919b2c27c48019207983a083a6422e9b27323c08e  assets/hero/yash-kanadhia-github-banner-option2-motion.mp4" | sha256sum -c -
          echo "c75467eee0a80e4c47fefb7e6b03f0c072b9447ad87919a73b5aaa6bfa9ac6c  assets/hero/yash-kanadhia-github-banner-option2-remotion-source.zip" | sha256sum -c -
          echo "1134dcc6ac654391ee47c30c3bc62b6cce7c7f501277892dee387cdc446578a8  README.md" | sha256sum -c -

      - name: Capture approved payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/profile-payload/assets/hero
          cp README.md /tmp/profile-payload/README.md
          cp assets/hero/yash-kanadhia-github-banner-option2-static.png /tmp/profile-payload/assets/hero/
          cp assets/hero/yash-kanadhia-github-banner-option2-motion.mp4 /tmp/profile-payload/assets/hero/
          cp assets/hero/yash-kanadhia-github-banner-option2-remotion-source.zip /tmp/profile-payload/assets/hero/

      - name: Confirm reviewed main baseline
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          current_main="$(git rev-parse origin/main)"
          expected_main="56156f3a09fec3a5a47cabdb98bd98ee6e4e3f84"
          test "$current_main" = "$expected_main" || {
            echo "main moved: expected $expected_main, found $current_main"
            exit 1
          }

      - name: Build clean main commit
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach 56156f3a09fec3a5a47cabdb98bd98ee6e4e3f84
          cp /tmp/profile-payload/README.md README.md
          mkdir -p assets/hero
          cp /tmp/profile-payload/assets/hero/yash-kanadhia-github-banner-option2-static.png assets/hero/
          cp /tmp/profile-payload/assets/hero/yash-kanadhia-github-banner-option2-motion.mp4 assets/hero/
          cp /tmp/profile-payload/assets/hero/yash-kanadhia-github-banner-option2-remotion-source.zip assets/hero/

          git config user.name "Yash Kanadhia"
          git config user.email "235186026+kanadhiayash@users.noreply.github.com"
          git add README.md \
                  assets/hero/yash-kanadhia-github-banner-option2-static.png \
                  assets/hero/yash-kanadhia-github-banner-option2-motion.mp4 \
                  assets/hero/yash-kanadhia-github-banner-option2-remotion-source.zip

          mapfile -t changed < <(git diff --cached --name-only)
          test "${#changed[@]}" -eq 4
          printf '%s\n' "${changed[@]}" | sort > /tmp/changed.txt
          cat > /tmp/expected.txt <<'EOF'
          README.md
          assets/hero/yash-kanadhia-github-banner-option2-motion.mp4
          assets/hero/yash-kanadhia-github-banner-option2-remotion-source.zip
          assets/hero/yash-kanadhia-github-banner-option2-static.png
          EOF
          sort /tmp/expected.txt -o /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt

          git commit -m "feat(profile): align Product Designer identity and approved banner"

      - name: Push clean commit to main
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:main
